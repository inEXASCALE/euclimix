name: Python tests and wheel
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install '.[test,build]'
      - run: python -m build
      - name: Install the built wheel (including CUDA sources and headers)
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Require 100% Python statements and branches
        run: python -m pytest -m 'not cuda' --cov=euclimix --cov-branch --cov-report=term-missing --cov-report=xml --junitxml=unit-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-${{ matrix.python }}
          path: |
            coverage.xml
            unit-tests.xml
            dist/

